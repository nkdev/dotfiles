# =====================================================================
# 🚀 Yazi 最新版公式設定ファイル (エラー完全修正・日時常時表示版)
# =====================================================================

# ---------------------------------------------------------------------
# 📂 1. ファイルマネージャー共通設定 (最新版の仕様に完全準拠)
# ---------------------------------------------------------------------
[mgr]
# 隠しファイル（ドットファイル）を常に最初から表示する
# show_hidden = true

# 正しいマウス操作の有効化 (エラーを回避し、クリックやスクロールを可能にします)
mouse_events = ["click", "scroll"]

# 各ファイル行の右端に表示する情報を「最終変更日時（mtime）」に強制固定！
linemode = "mtime"

# スクロール時に上下に確保する最低行数
scrolloff = 5

# タイトルバー（画面最上部）に現在いるフォルダのフルパスを表示
title_format = "Yazi: {cwd}"

# 同じフォルダを重複して開かないスマート・タブ機能を有効化
smart_tab = true

# 大量の画像があるフォルダでも、プレビュー速度を落とさない上限解放（正しい数値を設定）
image_bound = [0, 0, 0, 0]

# ---------------------------------------------------------------------
# 👁️ 2. 右側プレビュー画面の表示設定
# ---------------------------------------------------------------------
[preview]
# コードプレビュー時の「行番号」表示
line_numbers = true
max_width = 1920
max_height = 1080


# ---------------------------------------------------------------------
# 🛠️ 3. ファイルを開くアプリ（エディタ）の指定
# ---------------------------------------------------------------------
[opener]
# テキストファイルやコードを開くとき、Neovim (nvim) で開く
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim" },
]

